[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polysearch-ai"
version = "1.0.0"
description = "Modular, multi-source research pipeline with citation tier classification. Plug-and-play Python package + Claude Code skill."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "polysearch contributors" },
]
keywords = ["research", "ai", "citations", "perplexity", "firecrawl", "claude", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  "anthropic>=0.40,<1",
  "firecrawl-py>=3.1,<5",
  "rapidfuzz>=3.9,<4",
  "python-dotenv>=1,<2",
  "tenacity>=9,<10",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "pytest-mock>=3.14,<4",
  "respx>=0.21,<1",
  "syrupy>=4,<5",
  "build>=1,<2",
]

[project.scripts]
polysearch = "polysearch.cli:main"

[project.urls]
Homepage = "https://github.com/milock/polysearch"
Documentation = "https://github.com/milock/polysearch#readme"
Repository = "https://github.com/milock/polysearch"
Issues = "https://github.com/milock/polysearch/issues"
Changelog = "https://github.com/milock/polysearch/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polysearch = [
  "py.typed",
  "data/domain_tiers.yaml",
  "data/authoritative_schemas/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: tests that hit real APIs (opt-in via --run-live; skipped by default)",
  "integration: end-to-end pipeline tests with mocked providers",
  "slow: tests that take >1s",
]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/polysearch"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
