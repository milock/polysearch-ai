# Path rules apply only to domains ALREADY known at some tier — an
# unknown domain is never promoted or demoted into a tier by its path.
path_rules:
  # Any path substring here forces a known domain down to LOW (the
  # 'vendor marketing masquerading as research' guard). BLOCKED is exempt.
  downgrades:
    - /blog/
    - /resources/
    - /insights/
    - /marketing/
    - /guides/
    - /case-study/
    - /case-studies/
    - /whitepaper/
    - /whitepapers/
    - /white-paper/
    - /ebook/
    - /ebooks/
    - /webinar/
    - /webinars/
    - /landing/
    - /lp/
    - /thought-leadership/
    - /content-hub/
    - /sponsored/
    - /press/
    - /press-release
    - /whitepaper
  # Domain-scoped downgrades: path patterns that force LOW only on the named
  # host. Use these where a generic substring (e.g. /sites/) is a contributor
  # network or native-advertising surface on one publisher but a legitimate
  # asset path elsewhere — so it must never demote unrelated domains.
  downgrades_by_domain:
    forbes.com: [/sites/, /brandvoice/]
    linkedin.com: [/pulse/]
  # Primary-artifact paths on otherwise-COMMUNITY code/model hosts are
  # primary sources, not chatter — raise them to MEDIUM.
  upgrades:
    github.com:
      to: MEDIUM
      patterns: [/releases/, /releases/tag/, /blob/, /raw/, /tree/]
    huggingface.co:
      to: MEDIUM
      patterns: [/datasets/, /models/]
