# polysearch — source-authority domain tiers
# ----------------------------------------------------------------
# Maps domains to research-quality tiers for citation grading:
#   HIGH       primary data, peer-reviewed, official regulatory/statutory
#   MEDIUM     established trade / business journalism, major analysts
#   LOW        generic blog platforms, explicit vendor-marketing paths
#   COMMUNITY  social / UGC platforms (Reddit, X, YouTube, forums, ...)
#   BLOCKED    hard-excluded sources; dropped before grounding/community
#   UNKNOWN    domain not listed here (default at runtime)
#
# Root domains only (no scheme, no path). Subdomains auto-match
# (docs.example.gov -> example.gov). Bucket names are for readability;
# the loader flattens them. curated_core stays FIRST in each tier so the
# recovery allowlist (high_tier_domains()[:20]) is the hand-curated core.
#
# Provenance: merged 2026-07-13 from public credibility datasets —
# Domain Quality Ratings (DQR), Wikipedia Perennial Sources (WP:RSP),
# CRED-1, and the Iffy index; Tranco + Majestic Million ranks used as
# popularity features only.

